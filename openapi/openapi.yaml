openapi: 3.1.0
info:
  title: Cloud Phone Bridge API
  version: 0.1.0
  description: Unified control API for cloud Android phone providers.
servers:
  - url: https://bridge.example.com/v1
security:
  - bearerAuth: []
paths:
  /phones/batch-start:
    post:
      summary: Start multiple phones asynchronously
      operationId: batchStartPhones
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneIdsRequest'
      responses:
        '202':
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
  /phones/batch-stop:
    post:
      summary: Stop multiple phones asynchronously
      operationId: batchStopPhones
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneIdsRequest'
      responses:
        '202':
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
  /phones/connection-info:
    post:
      summary: Get connection information for phones
      operationId: getPhoneConnectionInfo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneIdsRequest'
      responses:
        '200':
          description: Connection information
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConnectionInfo'
  /jobs/{job_id}:
    get:
      summary: Get aggregate and per-phone job status
      operationId: getJob
      parameters:
        - name: job_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Job state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          description: Job not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
  schemas:
    PhoneIdsRequest:
      type: object
      required: [phone_ids]
      properties:
        phone_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
    JobAccepted:
      type: object
      required: [job_id, status]
      properties:
        job_id: { type: string, format: uuid }
        status: { type: string, const: queued }
    Job:
      type: object
      required: [job_id, operation, status, summary, items]
      properties:
        job_id: { type: string, format: uuid }
        operation: { type: string }
        status:
          type: string
          enum: [queued, running, partially_succeeded, succeeded, failed, cancelled]
        summary:
          type: object
          properties:
            total: { type: integer }
            succeeded: { type: integer }
            failed: { type: integer }
            pending: { type: integer }
        items:
          type: array
          items:
            $ref: '#/components/schemas/JobItem'
    JobItem:
      type: object
      required: [phone_id, status]
      properties:
        phone_id: { type: string, format: uuid }
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        error:
          $ref: '#/components/schemas/Error'
    ConnectionInfo:
      type: object
      required: [phone_id, access_host, access_port, expires_at]
      properties:
        phone_id: { type: string, format: uuid }
        access_host: { type: string }
        access_port: { type: integer, minimum: 1, maximum: 65535 }
        ticket: { type: string, writeOnly: true }
        expires_at: { type: string, format: date-time }
    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        retryable: { type: boolean }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
